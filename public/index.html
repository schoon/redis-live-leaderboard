<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Leaderboard</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 40rem;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    h1 { margin-bottom: 0.25rem; }
    .sub { opacity: 0.6; font-size: 0.875rem; margin-top: 0; }
    form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1.5rem 0; }
    input {
      padding: 0.5rem; font-size: 1rem; border-radius: 6px;
      border: 1px solid rgba(128, 128, 128, 0.5); background: transparent;
      color: inherit;
    }
    input[name="name"] { flex: 1; min-width: 8rem; }
    input[name="points"] { width: 6rem; }
    button {
      padding: 0.5rem 1rem; font-size: 1rem; border-radius: 6px;
      border: 1px solid rgba(128, 128, 128, 0.5); cursor: pointer;
      background: rgba(128, 128, 128, 0.12); color: inherit;
    }
    button:hover { background: rgba(128, 128, 128, 0.25); }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left; padding: 0.5rem;
      border-bottom: 1px solid rgba(128, 128, 128, 0.25);
    }
    th:last-child, td:last-child { text-align: right; }
    td.rank { width: 3rem; opacity: 0.6; font-variant-numeric: tabular-nums; }
    td.points { font-variant-numeric: tabular-nums; font-weight: 600; }
    .empty { opacity: 0.6; font-style: italic; }
    .status { min-height: 1.25rem; font-size: 0.875rem; margin-top: 1rem; }
    .status.error { color: #d33; }
    footer { margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>Live Leaderboard</h1>
  <p class="sub">Refreshes every 2 seconds.</p>

  <form id="score-form">
    <input name="name" placeholder="Player name" autocomplete="off" required>
    <input name="points" type="number" placeholder="Points" value="10" step="any" required>
    <button type="submit">Add points</button>
  </form>

  <table>
    <thead>
      <tr><th>#</th><th>Player</th><th>Points</th></tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="3" class="empty">Loading…</td></tr>
    </tbody>
  </table>

  <div class="status" id="status"></div>

  <footer>
    <button id="reset">Reset leaderboard</button>
  </footer>

  <script>
    const form = document.getElementById('score-form');
    const rowsEl = document.getElementById('rows');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset');

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? 'status error' : 'status';
    }

    function render(players) {
      if (players.length === 0) {
        rowsEl.innerHTML = '<tr><td colspan="3" class="empty">No scores yet.</td></tr>';
        return;
      }
      // Build with textContent rather than string-concatenated HTML so a player
      // named "<script>" is shown, not executed.
      rowsEl.replaceChildren(...players.map((p) => {
        const tr = document.createElement('tr');
        const rank = document.createElement('td');
        rank.className = 'rank';
        rank.textContent = p.rank;
        const name = document.createElement('td');
        name.textContent = p.name;
        const points = document.createElement('td');
        points.className = 'points';
        points.textContent = p.points;
        tr.append(rank, name, points);
        return tr;
      }));
    }

    async function refresh() {
      try {
        const res = await fetch('/leaderboard?top=10');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        render(await res.json());
        if (statusEl.classList.contains('error')) setStatus('');
      } catch (err) {
        setStatus('Could not reach the server — retrying…', true);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = form.name.value.trim();
      const points = Number(form.points.value);
      if (!name || !Number.isFinite(points)) return;

      try {
        const res = await fetch('/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, points }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'HTTP ' + res.status);
        setStatus(`${body.name} is now on ${body.points}.`);
        form.name.value = '';
        form.name.focus();
        refresh();
      } catch (err) {
        setStatus(err.message, true);
      }
    });

    resetBtn.addEventListener('click', async () => {
      if (!confirm('Clear every score?')) return;
      try {
        const res = await fetch('/reset', { method: 'POST' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        setStatus('Leaderboard cleared.');
        refresh();
      } catch (err) {
        setStatus(err.message, true);
      }
    });

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
