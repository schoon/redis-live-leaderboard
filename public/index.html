<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Leaderboard</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 52rem;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    h1 { margin-bottom: 0.25rem; }
    h2 { font-size: 1rem; margin: 0; }
    .sub { opacity: 0.6; font-size: 0.875rem; margin-top: 0; }
    form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1.5rem 0; }
    input {
      padding: 0.5rem; font-size: 1rem; border-radius: 6px;
      border: 1px solid rgba(128, 128, 128, 0.5); background: transparent;
      color: inherit;
    }
    input[name="name"] { flex: 1; min-width: 8rem; }
    input[name="points"] { width: 6rem; }
    button {
      padding: 0.5rem 1rem; font-size: 1rem; border-radius: 6px;
      border: 1px solid rgba(128, 128, 128, 0.5); cursor: pointer;
      background: rgba(128, 128, 128, 0.12); color: inherit;
    }
    button:hover { background: rgba(128, 128, 128, 0.25); }

    /* "Find my rank" result card. */
    .rank-result {
      margin: -0.5rem 0 1.5rem;
      padding: 0.6rem 0.9rem;
      border: 1px solid rgba(128, 128, 128, 0.35);
      border-radius: 8px;
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    .rank-result .place {
      font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .rank-result .who { font-weight: 600; }
    .rank-result .muted { opacity: 0.65; font-size: 0.875rem; }
    .rank-result.missing { border-style: dashed; }
    .rank-result.missing .muted { opacity: 0.8; }

    /* Two boards side by side, stacking on narrow screens. */
    .boards { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; }
    @media (max-width: 40rem) {
      .boards { grid-template-columns: 1fr; gap: 2rem; }
    }
    .board-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 0.5rem; margin-bottom: 0.5rem;
    }
    .board-tag {
      font-size: 0.75rem; opacity: 0.6; font-variant-numeric: tabular-nums;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left; padding: 0.4rem 0.5rem;
      border-bottom: 1px solid rgba(128, 128, 128, 0.25);
    }
    th { font-size: 0.75rem; text-transform: uppercase; opacity: 0.6; }
    th:last-child, td:last-child { text-align: right; }
    td.rank { width: 2.5rem; opacity: 0.6; font-variant-numeric: tabular-nums; }
    td.points { font-variant-numeric: tabular-nums; font-weight: 600; }
    .empty { opacity: 0.6; font-style: italic; }
    .status { min-height: 1.25rem; font-size: 0.875rem; margin-top: 1.5rem; }
    .status.error { color: #d33; }
    footer {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    footer a {
      font-size: 0.875rem; color: inherit; opacity: 0.6;
      text-decoration-thickness: 1px; text-underline-offset: 2px;
    }
    footer a:hover { opacity: 1; }
  </style>
</head>
<body>
  <h1>Live Leaderboard</h1>
  <p class="sub">Refreshes every 2 seconds. Scores count toward both boards.</p>

  <form id="score-form">
    <input name="name" placeholder="Player name" autocomplete="off" required>
    <input name="points" type="number" placeholder="Points" value="10" step="any" required>
    <button type="submit">Add points</button>
  </form>

  <form id="rank-form">
    <input name="name" placeholder="Find a player's rank" autocomplete="off">
    <button type="submit">Find rank</button>
  </form>

  <div class="rank-result" id="rank-result" hidden></div>

  <div class="boards">
    <section>
      <div class="board-head">
        <h2>All time</h2>
        <span class="board-tag">leaderboard</span>
      </div>
      <table>
        <thead>
          <tr><th>#</th><th>Player</th><th>Points</th></tr>
        </thead>
        <tbody id="all-time-rows">
          <tr><td colspan="3" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </section>

    <section>
      <div class="board-head">
        <h2>This week</h2>
        <span class="board-tag" id="week-tag">…</span>
      </div>
      <table>
        <thead>
          <tr><th>#</th><th>Player</th><th>Points</th></tr>
        </thead>
        <tbody id="weekly-rows">
          <tr><td colspan="3" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <div class="status" id="status"></div>

  <footer>
    <button id="reset">Reset both boards</button>
    <a href="https://github.com/schoon/redis-live-leaderboard"
       target="_blank" rel="noopener noreferrer">Source on GitHub ↗</a>
  </footer>

  <script>
    const form = document.getElementById('score-form');
    const rankForm = document.getElementById('rank-form');
    const rankResult = document.getElementById('rank-result');
    const allTimeRows = document.getElementById('all-time-rows');
    const weeklyRows = document.getElementById('weekly-rows');
    const weekTag = document.getElementById('week-tag');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('reset');

    // The name whose rank is currently on screen. Kept so the 2-second poll
    // keeps it up to date as other people score, instead of it going stale.
    let watching = '';

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.className = isError ? 'status error' : 'status';
    }

    function render(tbody, players, emptyMessage) {
      if (players.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 3;
        td.className = 'empty';
        td.textContent = emptyMessage;
        tr.append(td);
        tbody.replaceChildren(tr);
        return;
      }
      // Build with textContent rather than string-concatenated HTML so a player
      // named "<script>" is shown, not executed.
      tbody.replaceChildren(...players.map((p) => {
        const tr = document.createElement('tr');
        const rank = document.createElement('td');
        rank.className = 'rank';
        rank.textContent = p.rank;
        const name = document.createElement('td');
        name.textContent = p.name;
        const points = document.createElement('td');
        points.className = 'points';
        points.textContent = p.points;
        tr.append(rank, name, points);
        return tr;
      }));
    }

    async function getJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    function span(className, text) {
      const el = document.createElement('span');
      el.className = className;
      el.textContent = text;
      return el;
    }

    async function refreshRank() {
      if (!watching) {
        rankResult.hidden = true;
        rankResult.replaceChildren();
        return;
      }

      // encodeURIComponent so names with spaces or slashes survive the URL.
      const res = await fetch('/rank/' + encodeURIComponent(watching));
      const body = await res.json();
      rankResult.hidden = false;

      // 404 is the expected answer for "not on the board", not a failure.
      if (res.status === 404) {
        rankResult.className = 'rank-result missing';
        rankResult.replaceChildren(
          span('who', body.name),
          span('muted', "isn't on the board yet — names are case-sensitive.")
        );
        return;
      }
      if (!res.ok) throw new Error(body.error || 'HTTP ' + res.status);

      rankResult.className = 'rank-result';
      rankResult.replaceChildren(
        span('place', '#' + body.rank),
        span('who', body.name),
        span('muted', `of ${body.outOf} · ${body.points} points all time`)
      );
    }

    async function refresh() {
      try {
        // All in parallel, so one slow request doesn't stall the others.
        const [allTime, weekly] = await Promise.all([
          getJSON('/leaderboard?top=10'),
          getJSON('/leaderboard/weekly?top=10'),
          refreshRank(),
        ]);
        render(allTimeRows, allTime, 'No scores yet.');
        render(weeklyRows, weekly.players, 'Nothing scored this week.');
        weekTag.textContent = 'leaderboard:' + weekly.week;
        if (statusEl.classList.contains('error')) setStatus('');
      } catch (err) {
        setStatus('Could not reach the server — retrying…', true);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const name = form.name.value.trim();
      const points = Number(form.points.value);
      if (!name || !Number.isFinite(points)) return;

      try {
        const res = await fetch('/score', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, points }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'HTTP ' + res.status);
        setStatus(
          `${body.name}: ${body.points} all time, ${body.weekly.points} this week.`
        );
        form.name.value = '';
        form.name.focus();
        refresh();
      } catch (err) {
        setStatus(err.message, true);
      }
    });

    rankForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      // Submitting an empty box clears the result.
      watching = rankForm.name.value.trim();
      try {
        await refreshRank();
      } catch (err) {
        setStatus(err.message, true);
      }
    });

    resetBtn.addEventListener('click', async () => {
      if (!confirm('Clear the all-time board and this week\'s board?')) return;
      try {
        const res = await fetch('/reset', { method: 'POST' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        setStatus('Both boards cleared.');
        refresh();
      } catch (err) {
        setStatus(err.message, true);
      }
    });

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
